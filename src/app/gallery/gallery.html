<div class="app-content pt-3">
  <div class="container-fluid">
    <div class="row g-3">
      @for (item of items; track item.title) {
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100">
            <div class="ratio ratio-1x1 bg-secondary-subtle">
              <img src="https://picsum.photos/seed/{{ item.title }}/600/600"
                   class="card-img-top object-fit-cover" [alt]="item.title">
            </div>
            <div class="card-body">
              <h6 class="card-title mb-1">{{ item.title }}</h6>
              <small class="text-secondary">{{ item.info }}</small>
            </div>
          </div>
        </div>
      }
    </div>
    <div class="d-flex justify-content-between align-items-center my-3">
      <small class="text-secondary">Showing {{ items.length }} of {{ items.length }} items</small>
      <button type="button" class="btn btn-secondary btn-sm">
        <i class="bi bi-upload"></i> Upload
      </button>
    </div>
  </div>
</div>
